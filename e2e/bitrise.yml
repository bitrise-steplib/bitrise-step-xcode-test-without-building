format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  test_test_plans:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-swift-project-with-parallel-ui-test.git
    - TEST_APP_BRANCH: master
    - BITRISE_PROJECT_PATH: ./_tmp/BullsEye.xcworkspace
    - BITRISE_SCHEME: BullsEye
    - TEST_PLAN: FullTests
    - QUARANTINED_TESTS: |-
        [
          {
            "testCaseName": "testGameStyleSwitch()",
            "testSuiteName": [
              "BullsEyeUITests"
            ],
            "className": "BullsEyeUITests2"
          }
        ]
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/env bash
            set -xeo pipefail
            rm -rf "./_tmp"
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - branch: $TEST_APP_BRANCH
        - clone_into_dir: ./_tmp
    - xcode-build-for-test:
        inputs:
        - project_path: $BITRISE_PROJECT_PATH
        - scheme: $BITRISE_SCHEME
        - test_plan: $TEST_PLAN
        - destination: generic/platform=iOS Simulator
    - path::./:
        title: Step Test
        inputs:
        - xctestrun: $BITRISE_XCTESTRUN_FILE_PATH
        - destination: platform=iOS Simulator,name=Bitrise iOS default
        - xcodebuild_options: -parallel-testing-enabled NO
        - quarantined_tests: $QUARANTINED_TESTS
    - git::https://github.com/bitrise-steplib/bitrise-step-check-step-outputs.git@main:
        is_always_run: true
        inputs:
        - dirs: BITRISE_XCRESULT_PATH
        - deploy_dir: $BITRISE_DEPLOY_DIR
        - deployed_files: BITRISE_XCRESULT_ZIP_PATH
    - script:
        title: Check skipped tests
        summary: This Step checks if the test results contain the skipped test method or not.
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            out=$(xcrun xcresulttool get test-results tests --path "$BITRISE_XCRESULT_PATH")
            xcresulttool_exit_code=$?
            if [ $xcresulttool_exit_code -ne 0 ]; then
              echo "failed to get test results from xcresult: $out"
              exit 1
            fi
            # Check if the skipped test method is in the results
            set +e
            grep_out=$(echo "$out" | grep "BullsEyeUITests2/testGameStyleSwitch()")
            if [ ! -z "$grep_out" ]; then
              echo "skipped test method found in test results"
              exit 1
            fi

  test_swift_testing_quarantine:
    envs:
    - TEST_APP_URL: https://github.com/bitrise-io/sample-swift-project-with-parallel-ui-test.git
    - TEST_APP_BRANCH: add-swift-testing-unit-tests
    - BITRISE_PROJECT_PATH: ./_tmp/BullsEye.xcworkspace
    - BITRISE_SCHEME: BullsEye
    - TEST_PLAN: UnitTests
    - QUARANTINED_TESTS: |-
        [
          {
            "testCaseName": "scoreIsComputedWhenGuessIsHigherThanTarget()",
            "testSuiteName": [
              "BullsEyeTests"
            ],
            "className": "BullsEyeSwiftTestingTests"
          },
          {
            "testCaseName": "Score is computed when the guess matches the target",
            "testSuiteName": [
              "BullsEyeTests"
            ],
            "className": "BullsEyeSwiftTestingTests",
            "testCaseIdentifier": "BullsEyeSwiftTestingTests/scoreIsComputedWhenGuessMatchesTarget()"
          },
          {
            "testCaseName": "totalAddsUpTheRoundScores()",
            "testSuiteName": [
              "BullsEyeTests"
            ],
            "className": "BullsEyeSwiftTestingTests",
            "testCaseIdentifier": "BullsEyeSwiftTestingTests/TotalScore/totalAddsUpTheRoundScores()"
          }
        ]
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/env bash
            set -xeo pipefail
            rm -rf "./_tmp"
    - git::https://github.com/bitrise-steplib/bitrise-step-simple-git-clone.git:
        inputs:
        - repository_url: $TEST_APP_URL
        - branch: $TEST_APP_BRANCH
        - clone_into_dir: ./_tmp
    - xcode-build-for-test:
        inputs:
        - project_path: $BITRISE_PROJECT_PATH
        - scheme: $BITRISE_SCHEME
        - test_plan: $TEST_PLAN
        - destination: generic/platform=iOS Simulator
    - path::./:
        title: Step Test
        inputs:
        - xctestrun: $BITRISE_XCTESTRUN_FILE_PATH
        - destination: platform=iOS Simulator,name=Bitrise iOS default
        - xcodebuild_options: -parallel-testing-enabled NO
        - quarantined_tests: $QUARANTINED_TESTS
    - script:
        title: Check skipped Swift Testing tests
        summary: The quarantined Swift Testing tests must be absent from the results, while the non-quarantined ones from the same suites must be present.
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -ex
            # Xcode skips Swift Testing test cases from 16.3 on, older versions run them regardless of -skip-testing.
            version=`xcodebuild -version`
            regex="Xcode ([0-9]+)\.([0-9]+)"
            if [[ $version =~ $regex ]]; then
              if (( ${BASH_REMATCH[1]} < 16 || (${BASH_REMATCH[1]} == 16 && ${BASH_REMATCH[2]} < 3) )); then
                echo "$version cannot skip Swift Testing test cases, skipping this check"
                exit 0
              fi
            fi
            out=$(xcrun xcresulttool get test-results tests --path "$BITRISE_XCRESULT_PATH")
            xcresulttool_exit_code=$?
            if [ $xcresulttool_exit_code -ne 0 ]; then
              echo "failed to get test results from xcresult: $out"
              exit 1
            fi
            quarantined_tests=(
              "BullsEyeSwiftTestingTests/scoreIsComputedWhenGuessIsHigherThanTarget()"
              "BullsEyeSwiftTestingTests/scoreIsComputedWhenGuessMatchesTarget()"
              "BullsEyeSwiftTestingTests/TotalScore/totalAddsUpTheRoundScores()"
            )
            for test in "${quarantined_tests[@]}"; do
              if echo "$out" | grep -qF "$test"; then
                echo "quarantined Swift Testing test found in test results: $test"
                exit 1
              fi
            done
            control_tests=(
              "BullsEyeSwiftTestingTests/scoreIsComputedWhenGuessIsLowerThanTarget()"
              "BullsEyeSwiftTestingTests/scoreIsEventuallyComputedWhenGuessMatchesTarget()"
              "BullsEyeSwiftTestingTests/TotalScore/newGameResetsTheTotal()"
            )
            for test in "${control_tests[@]}"; do
              if ! echo "$out" | grep -qF "$test"; then
                echo "control Swift Testing test missing from test results, the suite may not have run: $test"
                exit 1
              fi
            done
